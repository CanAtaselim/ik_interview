# Uygulamanın tamamını yerelde ayağa kaldırır:  docker compose up -d --build
# Adres: http://localhost:8080  (port .env içindeki WEB_PORT ile değiştirilebilir)
# Gönderilen e-postalar: http://localhost:8025  (Mailpit; gerçek alıcıya hiçbir e-posta gitmez)
#
# Bu bir GELİŞTİRME kurulumudur: API "Development" ortamında çalışır, yani gerçek Active
# Directory yerine sabit test kullanıcıları kullanılır. Gizli değerler .env dosyasından
# okunur (bkz. .env.example).
services:
  postgres:
    image: postgres:17
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
    ports:
      # Yalnızca veritabanına dışarıdan (IDE, dotnet run) bağlanmak için; API ağ içinden erişir.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - recruitment-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: recruitment-api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=recruitment;Username=recruitment;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY .env dosyasinda tanimli olmali}
      # E-postalar geliştirmede Mailpit'e gider ve orada görüntülenir; kimse gerçekten almaz.
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__FromAddress: ik-ise-alim@sirket.local
      # Outlook yerine sabit sahte meşgul saatler (yalnızca Development). Gerçek Exchange için Graph__* alanları doldurulur.
      Graph__UseFake: "true"
      Recruitment__FrontendBaseUrl: http://localhost:${WEB_PORT:-8080}
    volumes:
      # Yüklenen CV'ler konteyner yeniden oluşturulsa da kalsın.
      - recruitment-files:/app/storage
    restart: unless-stopped

  # Geliştirme e-posta kutusu: uygulamanın gönderdiği tüm e-postaları yakalar.
  mailpit:
    image: axllent/mailpit:v1.24.0
    container_name: recruitment-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: recruitment-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  recruitment-pgdata:
  recruitment-files:
