# Arayüzü sunar ve API isteklerini backend konteynerine iletir. Tarayıcı her şeyi tek
# adresten gördüğü için CORS gerekmez ve refresh cookie'si sorunsuz çalışır.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CV yükleme: uygulamanın dosya sınırı 10 MB (nginx varsayılanı 1 MB olduğu için yükseltilir).
    client_max_body_size 12m;

    # /api: uygulama API'si. /openapi ve /scalar: geliştirme ortamındaki API belgeleri.
    location ~ ^/(api|openapi|scalar)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anlık bildirimler (SignalR): WebSocket bağlantısı uzun süre açık kalır.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Dosya adları içerik hash'i taşır; süresiz önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfa uygulaması: bilinmeyen her yol index.html'e düşer, yönlendirmeyi React yapar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
